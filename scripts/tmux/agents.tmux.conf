# scripts/tmux/agents.tmux.conf
# Loaded by scripts/tmux-session.sh for the tmux session that holds the agent sessions. Project-agnostic on purpose.

# Claude Code scrolls and selects with the mouse, and its sessions write a lot.
set -g mouse on
set -g history-limit 200000

# True color, and no delay on Escape (Claude Code's vim-style and Esc keys feel it).
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"
set -g escape-time 10

# Without extended keys, Claude Code key combos (Shift+Enter, Ctrl+Enter, ...) arrive as plain Enter.
set -g extended-keys on
set -as terminal-features ",*:extkeys"

# Let programs inside a pane pass escape sequences through (image previews, OSC 52 clipboard).
set -g allow-passthrough on
set -g set-clipboard on

# A window is named after its session (sibling-shell.sh renames it); keep names stable and numbering gap-free.
set -g allow-rename off
set -g renumber-windows on
set -g base-index 1
# remain-on-exit stays off (default): a wrapper that exits with no hand-off closes its window like a closed tab.
