# gitleaks config for this repo. CI runs it on each push and pull request diff; the opt-in pre-push hook
# (.github/hooks/install-pre-push.sh) runs it on the commits you push. Tested with gitleaks 8.30.1.
# tests/leak-guard.test.sh checks the same personal-detail classes on the working tree.
title = "orchestration-kit"

# Every built-in gitleaks rule (cloud keys, GitHub, Anthropic, OpenAI and other tokens, private keys, ...).
[extend]
useDefault = true

# A real user's home directory: the same rule as tests/leak-guard.test.sh (its part 3 feeds this regex the same cases, so the
# two cannot drift). home or users counts only as the FIRST directory of an absolute path: at a line start or after
# whitespace, a quote, =, :, ( or , or right after a known root (/mnt/<x>, /var, /tmp, /var/tmp, a drive, a UNC \\host\share,
# file://, ~, .. segments, a $VAR). Separators are / or \ or %2F / %5C, any case. Safe: only the test sandboxes ($SB, $TMPDIR,
# one mktemp-style /tmp segment). The secret is the user name alone: the default global allowlist drops any secret that
# itself looks like /home/... or /Users/...
[[rules]]
id = "home-path"
description = "A home or users directory path names a real machine user"
regex = '''(?im)(?:^|[\s"'`=:(,])(?:/mnt/[^\\/\s]+|/var|/(?:var/)?tmp(?:[\\/][^\\/\s]+)*|[A-Za-z]:|[\\/]{2,}[^\\/\s]+[\\/]+[^\\/\s]+|file:(?://|%2F%2F)[^\\/\s%]*|~|\.\.|\$(?:\{[A-Za-z_][A-Za-z0-9_]*\}|[A-Za-z_][A-Za-z0-9_]*))?(?:[\\/]+\.\.)*(?:[\\/]|%2F|%5C)+(?:home|users)(?:[\\/]|%2F|%5C)+([A-Za-z0-9_][A-Za-z0-9._\-]*)'''
secretGroup = 1
keywords = ["home", "users"]
[[rules.allowlists]]
regexTarget = "secret"
regexes = ['''(?i)^(?:u|x|you|user|username|me|name|example|runner|public|default|shared|home|users)$''']
[[rules.allowlists]]
regexTarget = "match"
regexes = ['''(?i)^[\s"'`=:(,]?(?:\$(?:\{(?:SB|TMPDIR)\}|(?:SB|TMPDIR))|/tmp/[A-Za-z0-9_-]*\.[A-Za-z0-9]{6,})(?:[\\/]|%2F|%5C)+(?:home|users)(?:[\\/]|%2F|%5C)+[A-Za-z0-9_][A-Za-z0-9._-]*$''']

# A personal email address. Noreply forms and the reserved example.* domains are allowed.
[[rules]]
id = "email"
description = "An email address other than a noreply form"
regex = '''([A-Za-z0-9._%+\-]+@[A-Za-z0-9\-]+(?:\.[A-Za-z0-9\-]+)*\.[A-Za-z]{2,})'''
secretGroup = 1
keywords = ["@"]
[[rules.allowlists]]
regexTarget = "secret"
regexes = [
  '''@users\.noreply\.github\.com$''',
  '''^noreply@anthropic\.com$''',
  '''^noreply@github\.com$''',
  '''^git@github\.com$''',
  '''@example\.(?:com|org|net)$''',
]

# The status HUD's e2e test feeds a fake "Authorization: SECRET-TOKEN" curl line to prove the HUD never
# writes it out. All three must match (rule, file, placeholder), so a real token there still fails.
[[allowlists]]
description = "status-hud redaction fixture"
targetRules = ["curl-auth-header"]
condition = "AND"
paths = ['''^plugins/status-hud/tests/e2e\.test\.ts$''']
regexTarget = "line"
regexes = ['''Authorization: SECRET-TOKEN"''']
