# gitleaks config for this repo. CI runs it on each push and pull request diff; the opt-in pre-push hook
# (.github/hooks/install-pre-push.sh) runs it on the commits you push. Tested with gitleaks 8.30.1.
# tests/leak-guard.test.sh checks the same personal-detail classes on the working tree.
title = "orchestration-kit"

# Every built-in gitleaks rule (cloud keys, GitHub, Anthropic, OpenAI and other tokens, private keys, ...).
[extend]
useDefault = true

# A real user's home directory: the same INVERTED rule as tests/leak-guard.test.sh (its part 3 feeds this regex the same
# cases, so the two cannot drift). Any home or users directory after one or more separators (/ or \, or URL-encoded %2F /
# %5C), in any case, followed by a user name. The only safe prefixes are the test sandboxes: a shell variable right before
# it ($SB, ${SB}) and a /tmp/... path whose segments are not "..". The secret is the user name alone (group 2): the default
# global allowlist drops any secret that itself looks like /home/... or /Users/...
[[rules]]
id = "home-path"
description = "A home or users directory path names a real machine user"
regex = '''(?i)(\$\{[^}\s]*\}|\$[A-Za-z_][A-Za-z0-9_]*|/tmp(?:/[A-Za-z0-9_-][A-Za-z0-9._-]*)*)?(?:[\\/]|%2F|%5C)+(?:home|users)(?:[\\/]|%2F|%5C)+([A-Za-z0-9_][A-Za-z0-9._\-]*)'''
secretGroup = 2
keywords = ["home", "users"]
[[rules.allowlists]]
regexTarget = "secret"
regexes = ['''(?i)^(?:u|x|you|user|username|me|name|example|runner|Public|Default)$''']
[[rules.allowlists]]
regexTarget = "match"
regexes = ['''(?i)^(?:\$|/tmp)''']

# A personal email address. Noreply forms and the reserved example.* domains are allowed.
[[rules]]
id = "email"
description = "An email address other than a noreply form"
regex = '''([A-Za-z0-9._%+\-]+@[A-Za-z0-9\-]+(?:\.[A-Za-z0-9\-]+)*\.[A-Za-z]{2,})'''
secretGroup = 1
keywords = ["@"]
[[rules.allowlists]]
regexTarget = "secret"
regexes = [
  '''@users\.noreply\.github\.com$''',
  '''^noreply@anthropic\.com$''',
  '''^noreply@github\.com$''',
  '''^git@github\.com$''',
  '''@example\.(?:com|org|net)$''',
]

# The status HUD's e2e test feeds a fake "Authorization: SECRET-TOKEN" curl line to prove the HUD never
# writes it out. All three must match (rule, file, placeholder), so a real token there still fails.
[[allowlists]]
description = "status-hud redaction fixture"
targetRules = ["curl-auth-header"]
condition = "AND"
paths = ['''^plugins/status-hud/tests/e2e\.test\.ts$''']
regexTarget = "line"
regexes = ['''Authorization: SECRET-TOKEN"''']
